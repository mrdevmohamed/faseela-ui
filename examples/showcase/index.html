<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1D1A" />
  <meta name="description" content="Faseela UI — a full-screen interactive app built with Rust and WebAssembly." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Faseela</title>
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    :root { color-scheme: dark; background: #0A1D1A; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0A1D1A; }
    body { position: fixed; inset: 0; overscroll-behavior: none; }
    #faseela-ui-canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      outline: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #loading {
      position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
      color: #E8F7EE; background: #0A1D1A; font: 14px system-ui, sans-serif;
      text-align: center; pointer-events: none;
    }
    #loading strong { color: #9BEBB8; font-size: 22px; letter-spacing: .08em; }
    #loading span { color: #91b5a2; }
    @media (orientation: landscape) and (max-height: 480px) {
      #faseela-ui-canvas { padding-top: env(safe-area-inset-top); }
    }
  </style>
</head>
<body>
  <div id="loading"><strong>FASEELA</strong><span>Starting the interactive experience…</span></div>
  <canvas id="faseela-ui-canvas"></canvas>
  <script>
    const canvas = document.getElementById('faseela-ui-canvas');
    const observer = new ResizeObserver(() => {
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    });
    observer.observe(document.documentElement);
    window.addEventListener('resize', () => {
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }, { passive: true });
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      const observer = new MutationObserver(() => {
        if (canvas.width > 0 && canvas.height > 0) {
          loading.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });
    });
  </script>
</body>
</html>
