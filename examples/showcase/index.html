<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A1D1A" />
  <meta name="description" content="Interactive WebAssembly showcase for the Faseela UI Rust component library." />
  <title>Faseela UI — Interactive Showcase</title>
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0A1D1A; color: #E8F7EE; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #17382d 0, #0A1D1A 58%); }
    header { max-width: 1100px; margin: auto; padding: 28px 24px 14px; }
    .brand { color: #9BEBB8; font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 6px; font-size: clamp(28px, 5vw, 46px); }
    header p { margin: 0; color: #a9c8b7; }
    main { max-width: 1100px; margin: auto; padding: 18px 24px 36px; }
    .surface { overflow: hidden; border: 1px solid #2a5142; border-radius: 18px; background: #0d241e; box-shadow: 0 24px 80px #0006; }
    #faseela-ui-canvas { display: block; width: 100%; height: min(720px, 78vh); min-height: 560px; outline: none; }
    footer { max-width: 1100px; margin: auto; padding: 0 24px 28px; color: #86a999; font-size: 13px; }
    a { color: #9BEBB8; }
    @media (max-width: 600px) {
      header, main { padding-left: 12px; padding-right: 12px; }
      #faseela-ui-canvas { min-height: 620px; height: 78vh; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Faseela · UI</div>
    <h1>Interactive component showcase</h1>
    <p>Real Rust UI components running in your browser through WebAssembly.</p>
  </header>
  <main>
    <section class="surface" aria-label="Interactive Faseela UI demo">
      <canvas id="faseela-ui-canvas"></canvas>
    </section>
  </main>
  <footer>
    Built with Rust, egui and WebAssembly ·
    <a href="https://github.com/mrdevmohamed/faseela-ui">Source on GitHub</a>
  </footer>
</body>
</html>
