<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Faseela UI — a full-screen interactive app built with Rust and WebAssembly." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Faseela</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230A1D1A'/%3E%3Cpath%20d='M10%207h13v5h-8v4h7v5h-7v9h-5z'%20fill='%239BEBB8'/%3E%3C/svg%3E" />
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    :root {
      color-scheme: light dark;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    #faseela-ui-canvas {
      display: block;
      background: transparent;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    @supports (height: 100dvh) {
      html, body, #faseela-ui-canvas { height: 100dvh; }
    }
    @media (max-width: 680px) {
      html, body { width: 100vw; }
      #faseela-ui-canvas { width: 100vw; }
    }
  </style>
</head>
<body>
  <canvas id="faseela-ui-canvas" aria-label="Faseela interactive application"></canvas>
</body>
</html>
