<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1D1A" />
  <meta name="description" content="Faseela UI — a full-screen interactive app built with Rust and WebAssembly." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Faseela</title>
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    :root {
      color-scheme: dark;
      background: #0A1D1A;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0A1D1A;
    }
    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
    #faseela-ui-canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    @supports (height: 100dvh) {
      html, body, #faseela-ui-canvas { height: 100dvh; }
    }
    @media (max-width: 680px) {
      html, body { width: 100vw; }
      #faseela-ui-canvas { width: 100vw; }
    }
  </style>
</head>
<body>
  <canvas id="faseela-ui-canvas" aria-label="Faseela interactive application"></canvas>
</body>
</html>
